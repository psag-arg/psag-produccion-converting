<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PSAG.Mantenimiento.Web</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/tema.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        // T-806: el tema se pone antes de pintar (sin parpadeo). Lo elegido con el botón (localStorage "theme") manda;
        // si no se eligió nada, sigue la preferencia del sistema (prefers-color-scheme). ThemeService lo lee después.
        (function () {
            var t = null;
            try { t = localStorage.getItem("theme"); } catch (e) { }
            if (t !== "dark" && t !== "light")
                t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.setAttribute("data-bs-theme", t);
        })();
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PSAG.Mantenimiento.Web.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
