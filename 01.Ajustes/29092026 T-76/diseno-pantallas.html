<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSAG Converting · Ajustes T-76</title>
<style>
  :root{
    --bg:#191919; --side:#1e1e1e; --side2:#232323; --field:#2b2b2b; --field2:#333;
    --line:#383838; --line2:#2e2e2e; --ink:#e8e8e8; --muted:#8b8b8b; --dim:#6a6a6a;
    --row:#3a3a3a; --accent:#2f5da8; --hand:#e0568c; --note:#fbf3bd; --noteink:#3d3a20;
    --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.23,1,.32,1);
    --t-tap:110ms; --t-hover:130ms; --t-pop:180ms;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--bg);color:var(--ink);
    font:13px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select{font:inherit;color:inherit;background:none;border:0;outline:0;min-width:0}
  :focus-visible{outline:2px solid #6b8fd4;outline-offset:1px;border-radius:4px}
  .f:focus-within{border-color:#6b8fd4}

  #app{position:relative;height:100%;overflow:hidden}
  #stage{position:absolute;inset:0}
  #viewport{position:absolute;inset:0;overflow:hidden;cursor:grab}
  #viewport.panning{cursor:grabbing}
  #viewport.pen{cursor:crosshair}
  #viewport.noting{cursor:copy}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #ink{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  #deny{position:fixed;z-index:7;pointer-events:none;opacity:0;display:grid;place-items:center;
    border:1.5px dashed var(--dim);background:rgb(255 255 255/.05);color:var(--dim);
    font-size:12px;border-radius:6px;transition:opacity 90ms linear}

  .board{position:absolute}
  .board-strip{display:flex;align-items:center;gap:8px;height:26px;color:var(--muted);
    font-size:13px;user-select:none}
  .board-strip .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board-strip .ic{opacity:0;display:flex;gap:10px;transition:opacity .14s var(--ease)}
  .board-strip .ic button{display:flex;color:var(--muted);
    transition:color var(--t-hover) var(--ease),transform var(--t-tap) var(--ease-out)}
  .board-strip .ic button:active{transform:scale(.9)}
  .board-frame{background:#fff;overflow:hidden;box-shadow:0 1px 3px rgb(0 0 0/.4)}
  .board.selected .board-frame{outline:2px solid var(--hand);outline-offset:0}
  .board-frame iframe{display:block;width:100%;height:100%;border:0;background:#fff}
  .note{position:absolute;background:var(--note);color:var(--noteink);padding:12px 14px;
    font-size:12.5px;line-height:1.5;white-space:pre-wrap;cursor:grab;
    box-shadow:0 2px 8px rgb(0 0 0/.35);
    transition:box-shadow var(--t-pop) var(--ease-out)}
  .note.dragging{cursor:grabbing;box-shadow:0 10px 26px rgb(0 0 0/.5)}
  .note[contenteditable=true]{outline:2px solid var(--hand);cursor:text}

  #topbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;
    gap:10px;padding:0 344px 0 14px;pointer-events:none;z-index:6}
  #topbar>*{pointer-events:auto}
  #doc-title{color:var(--muted);font-size:13px}
  #topbar .sp{flex:1}
  #t-toggle{width:30px;height:26px;border-radius:6px;display:grid;place-items:center;
    background:var(--accent);color:#fff}
  #t-present{padding:5px 12px;border-radius:7px;color:var(--muted);
    transition:background var(--t-hover) var(--ease),color var(--t-hover) var(--ease),
      transform var(--t-tap) var(--ease-out)}
  #t-present:hover{background:var(--field);color:var(--ink)}
  #t-present:active{transform:scale(.97)}
  #t-save{padding:5px 14px;border-radius:7px;border:1px solid var(--line);color:var(--ink);
    transition:background var(--t-hover) var(--ease),transform var(--t-tap) var(--ease-out)}
  #t-save:active{transform:scale(.97)}
  #t-save:disabled{opacity:.6;transform:none}
  #t-toggle{transition:transform var(--t-tap) var(--ease-out),filter var(--t-hover) var(--ease)}
  #t-toggle:active{transform:scale(.94)}

  #bar{position:absolute;left:50%;bottom:18px;transform:translateX(calc(-50% - 165px));display:flex;
    align-items:center;gap:2px;padding:4px;background:var(--side);border:1px solid var(--line);
    border-radius:9px;box-shadow:0 6px 20px rgb(0 0 0/.4)}
  #bar button{padding:5px 10px;border-radius:6px;color:var(--muted);
    transition:background var(--t-hover) var(--ease),color var(--t-hover) var(--ease),
      transform var(--t-tap) var(--ease-out)}
  #bar button:active{transform:scale(.96)}
  body.no-side #bar{transform:translateX(-50%)}
  #zoom{min-width:46px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
  #bar .sep{width:1px;height:16px;background:var(--line);margin:0 4px}
  #pages{padding:4px 8px;border-radius:6px;color:var(--muted)}

  /* ---- sidebar ---- */
  #side{position:absolute;top:0;right:0;bottom:0;width:330px;z-index:5;
    background:var(--side);border-left:1px solid var(--line2);
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:-1px 0 0 var(--line2), -18px 0 34px rgb(0 0 0/.28);
    transition:transform 260ms var(--ease-out)}
  body.no-side #side{transform:translateX(100%)}
  #topbar{transition:padding-right 260ms var(--ease-out)}
  body.no-side #topbar{padding-right:14px}
  #bar{transition:transform 260ms var(--ease-out)}
  #tabs{display:flex;gap:20px;padding:14px 18px 12px;border-bottom:1px solid var(--line2)}
  #tabs button{color:var(--dim);font-size:14px;padding:0;
    transition:color var(--t-hover) var(--ease)}
  #tabs button.on{color:#fff;font-weight:600}
  #tools{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line2)}
  #tools button{width:36px;height:32px;border-radius:7px;display:grid;place-items:center;
    color:var(--muted);transition:background var(--t-hover) var(--ease),
      color var(--t-hover) var(--ease),transform var(--t-tap) var(--ease-out)}
  #tools button:active{transform:scale(.94)}
  #tools button.on{background:var(--field2);color:#fff;box-shadow:inset 0 0 0 1px var(--line)}

  #hint{padding:0 12px 9px;color:var(--dim);font-size:12px;border-bottom:1px solid var(--line2);
    margin-top:-4px}
  #hint b{color:var(--muted);font-weight:500}
  #tree{max-height:230px;min-height:120px;overflow:auto;padding:8px 0;
    border-bottom:1px solid var(--line2);resize:vertical}
  .tr{display:flex;align-items:center;gap:6px;padding:3px 14px 3px 0;cursor:default;
    white-space:nowrap;transition:background var(--t-hover) var(--ease)}
  .tr.on{background:var(--row)}
  .tr .cv{width:14px;flex:none;display:grid;place-items:center;color:var(--dim);cursor:pointer}
  .tr .gl{width:14px;flex:none;display:grid;place-items:center;color:var(--dim)}
  .tr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .tr.ab .nm{font-size:14px}
  .tr .rt{color:var(--dim);font-size:12px;flex:none}

  #props{flex:1;overflow-y:auto}
  #props .sec{border-bottom:1px solid var(--line2);padding:14px}
  #props .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  #props .sh b{font-weight:500;font-size:14px}
  #props .sh .rs{color:var(--dim);font-size:13px;cursor:pointer}
  #props .sh .rs:hover{color:var(--ink)}
  #props .g{display:flex;gap:8px;margin-bottom:8px}
  .f{flex:1;display:flex;align-items:center;gap:8px;background:var(--field);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:0}
  .f .lb{color:var(--muted);flex:none;display:flex;align-items:center;gap:6px}
  .f .lb i{width:5px;height:5px;border-radius:50%;background:#6b8fd4;display:none}
  .f.set .lb i{display:block}
  .f input{flex:1;text-align:right;font-variant-numeric:tabular-nums;
    transition:color 120ms var(--ease)}
  .f input.bad{color:#e0568c}
  .f .u{color:var(--dim);flex:none}
  .f .sw{width:18px;height:18px;border-radius:5px;border:1px solid var(--line);flex:none;
    padding:0;overflow:hidden}
  .f select{color:var(--ink);text-align:right;flex:1;cursor:pointer}
  .seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:8px;
    padding:2px;gap:2px}
  .seg button{flex:1;padding:5px 8px;border-radius:6px;color:var(--muted);font-size:12.5px;
    transition:background var(--t-hover) var(--ease),color var(--t-hover) var(--ease),
      transform var(--t-tap) var(--ease-out)}
  .seg button:active{transform:scale(.96)}
  .seg button.on{background:var(--field2);color:#fff}
  .seg.ic button{display:grid;place-items:center;padding:5px 0}
  #props .add{color:var(--dim);font-size:12.5px;margin-top:2px}
  #props .add span{cursor:pointer}
  #props .add span:hover{color:var(--ink)}
  #props .empty{padding:60px 24px;text-align:center;color:var(--dim);line-height:1.7}
  #props .empty b{display:block;color:var(--muted);font-weight:400;font-size:14px;
    margin-bottom:4px}
  #props .btn{padding:6px 14px;border-radius:7px;background:var(--field2);color:var(--ink);
    border:1px solid var(--line);transition:background var(--t-hover) var(--ease),
      transform var(--t-tap) var(--ease-out)}
  #props .btn:active{transform:scale(.97)}
  #props .btn.ghost{background:transparent;color:var(--muted)}
  #props textarea{width:100%;background:var(--field);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;resize:vertical;
    min-height:66px}

  @media (hover:hover) and (pointer:fine){
    #tools button:hover{background:var(--field);color:var(--ink)}
    #bar button:hover{background:var(--field);color:var(--ink)}
    #t-save:hover{background:var(--field)}
    #tabs button:hover{color:var(--ink)}
    .tr:hover{background:#2a2a2a}
    .board:hover .board-strip .ic{opacity:1}
    .board-strip .ic button:hover{color:var(--ink)}
    .seg button:hover:not(.on){color:var(--ink)}
    #props .sh .rs:hover{color:var(--ink)}
    #props .add span:hover{color:var(--ink)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}
    #side,#bar,#topbar{transition:none!important}
    #tools button:active,#bar button:active,#t-save:active,.seg button:active,
    #t-toggle:active,.board-strip .ic button:active{transform:none}
  }

  body.view #side,body.view #tools,body.view #tabs{display:none}
  body.view #app{--noop:0}
  body.view #side{display:none}
  #stagebar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;
    display:none;align-items:center;gap:6px;padding:6px 8px;background:var(--side);
    border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 20px rgb(0 0 0/.45)}
  body.present #stagebar{display:flex}
  #stagebar button{padding:5px 11px;border-radius:6px;color:var(--muted);
    transition:background var(--t-hover) var(--ease),color var(--t-hover) var(--ease),
      transform var(--t-tap) var(--ease-out)}
  #stagebar button:active{transform:scale(.96)}
  #slide-n{color:var(--muted);font-variant-numeric:tabular-nums;min-width:54px;text-align:center}
  body.present #topbar,body.present #bar,body.present #side,body.present #deny{display:none}
  #focus{position:fixed;inset:0;z-index:30;background:var(--bg);display:none}
  #focus.on{display:block}
  #focus iframe{width:100%;height:100%;border:0;background:#fff}
  body.present #focus{background:#0d0d0d;display:grid;place-items:center;padding:34px 34px 74px}
  body.present #focus iframe{border-radius:3px;box-shadow:0 12px 44px rgb(0 0 0/.6)}
  body.present #focus-close{display:none}
  #focus-close{position:fixed;top:14px;right:14px;z-index:31;padding:6px 14px;
    background:var(--side);border:1px solid var(--line);border-radius:7px}
  #print-out{position:absolute;left:-100000px;top:0;width:1px;height:1px;overflow:hidden}
  #print-out iframe{border:0;display:block}
  @media print{
    #app,#topbar,#bar,#focus{display:none!important}
    #print-out{position:static!important;left:auto!important;width:auto!important;
      height:auto!important;overflow:visible!important}
    #print-out .p{page-break-after:always}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="viewport"><div id="world"><svg id="ink"></svg></div></div>
    <div id="deny">Drop inside an artboard</div>
    <div id="topbar">
      <span id="doc-title">PSAG Converting · Ajustes T-76</span><span class="sp"></span>
      <button id="t-present" title="Present (P)">Present</button>
      <button id="t-toggle" title="Toggle sidebar"></button>
      <button id="t-save">Save</button>
    </div>
    <div id="bar">
      <select id="pages" hidden></select><span class="sep" id="pages-sep" hidden></span>
      <button id="zoom-out">&minus;</button><span id="zoom">100%</span>
      <button id="zoom-in">+</button><button id="fit">Fit</button>
      <span class="sep"></span><button id="print">Export PDF</button>
    </div>
  </div>
  <aside id="side">
    <div id="tabs">
      <button class="on" data-tab="edit">Edit</button>
      <button data-tab="code">Code</button>
      <button data-tab="tweaks">Tweaks</button>
    </div>
    <div id="tools"></div>
    <div id="hint"></div>
    <div id="tree"></div>
    <div id="props"></div>
  </aside>
</div>
<div id="focus"><button id="focus-close">Close</button></div>
<div id="stagebar">
  <button id="s-prev">&larr;</button><span id="slide-n"></span>
  <button id="s-next">&rarr;</button><span class="sep"></span>
  <button id="s-exit">Exit</button>
</div>
<div id="print-out"></div>

const _rcache = new Map();
function resolve(src, withAgent) {
  const ck = (withAgent === false ? "0" : "1") + src;
  const hit = _rcache.get(ck); if (hit !== undefined) return hit;
  let out = src;
  for (const [name, data] of Object.entries(files)) {
    if (!IMG.test(name)) continue;
    const ext = name.split(".").pop().toLowerCase();
    const uri = "data:" + (MIME[ext] || "application/octet-stream") + ";base64," + data;
    const esc = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    out = out.replace(new RegExp('src="\\.?/?' + esc + '"', "g"), 'src="' + uri + '"');
    out = out.replace(new RegExp("url\\((['\"]?)\\.?/?" + esc + "\\1\\)", "g"), "url(" + uri + ")");

  out = withAgent === false ? out : out + AGENT;
  if (_rcache.size > 64) _rcache.clear();
  _rcache.set(ck, out);
  return out;

addEventListener("keydown", (e) => {

    e.preventDefault(); step(!e.shiftKey); return;
  }
  if (e.metaKey || e.ctrlKey) return;
  if (e.key.toLowerCase() === "p") { present(!document.body.classList.contains("present")); return; }

  const t = TOOLS.find(t => t[2] === e.key.toLowerCase());

const shown = new Map();     // file -> { el, src }
function render() {
  const want = new Map();
  for (const b of boards) if (onPage(b) && files[b.file] !== undefined) want.set(b.file, b);

  for (const [file, rec] of [...shown]) {
    if (want.has(file)) continue;
    rec.el.remove(); shown.delete(file); frames.delete(file); _openSig = null;
  }
  for (const [file, b] of want) {
    const rec = shown.get(file);
    if (rec) {                                   // reuse: never reload a live iframe
      rec.el.style.left = (b.x || 0) + "px";
      rec.el.style.top = ((b.y || 0) - 26) + "px";
      rec.el.style.width = (b.w || 800) + "px";
      rec.el.querySelector(".board-frame").style.height = (b.h || 600) + "px";
      rec.el.querySelector(".nm").textContent = b.title || file.replace(/\.html$/i, "");
      if (rec.src !== files[file]) {
        rec.src = files[file];
        rec.el.querySelector("iframe").srcdoc = resolve(files[file]);

    world.append(makeBoard(b)); _openSig = null;

  for (const n of notes) {

    const el = document.createElement("div");
    el.className = "note"; el.dataset.id = n.id;
    el.style.cssText = `left:${n.x||0}px;top:${n.y||0}px;width:${n.w||240}px`;
    el.textContent = n.text || ""; wireNote(el, n); world.append(el);
  }
  apply();
}
function makeBoard(b) {

let _openSig = null;
function markTree() {   // selection-only change: move the highlight, do not rebuild

function drawTree() {
  const sig = [...open].sort().join("|") + "#" + (pages.length ? page : "");
  if (sig === _openSig && treeEl.children.length) return markTree();
  _openSig = sig;
  treeEl.textContent = "";
  for (const b of boards) {
    if (!onPage(b)) continue;
    const t = trees.get(b.file);
    const key = b.file;
    const isOpen = open.has(key);
    treeEl.append(row({
      depth: 0, kind: "ab", name: b.title || b.file.replace(/\.html$/i, ""),
      right: (b.w || 800) + " × " + (b.h || 600),
      on: boardSel === b.file && !sel, hasKids: !!(t && t.kids.length), isOpen,
      onToggle: () => { isOpen ? open.delete(key) : open.add(key); drawTree(); },
      onClick: () => selectBoard(b.file), key,
    }));

  if (!treeEl.children.length) {

function walk(kids, file, depth) {

    const isOpen = open.has(key);
    treeEl.append(row({
      depth, name: n.name, right: n.tag, kind: "el",
      on: sel && sel.file === file && sel.path.join(".") === n.path.join("."),
      hasKids: n.kids.length > 0, isOpen,
      onToggle: () => { isOpen ? open.delete(key) : open.add(key); drawTree(); },
      onClick: () => { const f = frames.get(file);

/* ---- properties ----------------------------------------------------------- */
const px = (v) => (v || "").replace(/px$/, "");
const hex = (c) => { const m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)/.exec(c || "");
  return m ? "#" + [1,2,3].map(i => (+m[i]).toString(16).padStart(2, "0")).join("").toUpperCase() : "#000000"; };
const hist = []; let hpos = 0, replaying = false;
function record(e) {
  if (replaying) return;
  hist.length = hpos; hist.push(e); hpos = hist.length;
  if (hist.length > 200) { hist.shift(); hpos--; }
}
const snap = () => JSON.stringify({ n: notes, d: drawings, b: boards });
let base = null;
function mark() { base = snap(); }
function commitCanvas(label) {
  const after = snap(); if (after === base) return;
  record({ kind: "canvas", label, prev: base, next: after }); base = after;
}
function applyCanvas(json) {
  const o = JSON.parse(json);
  notes.length = 0; notes.push(...o.n);
  drawings.length = 0; drawings.push(...o.d);
  boards.length = 0; boards.push(...o.b);
  manifest.notes = notes; manifest.drawings = drawings; manifest.artboards = boards;
  render(); paintInk(); drawTree();
}
function step(back) {
  const e = back ? hist[hpos - 1] : hist[hpos];
  if (!e) return;
  const f = e.file ? frames.get(e.file) : null;
  if (e.file && !f) return;
  replaying = true;
  const v = back ? e.prev : e.next;
  if (e.kind === "canvas") { applyCanvas(v); base = v; }
  else if (e.kind === "src") { files[e.file] = v; _rcache.clear(); render(); askTree(e.file);
    if (tab === "code") setTimeout(drawCode, 60); }
  else if (e.kind === "text") tellAgent(f, { t: "text", path: e.path, value: v });
  else if (e.kind === "size") {
    tellAgent(f, { t: "style", path: e.path, prop: "width", value: back ? e.pw : e.w });
    tellAgent(f, { t: "style", path: e.path, prop: "height", value: back ? e.ph : e.h });
  } else tellAgent(f, { t: "style", path: e.path, prop: e.prop, value: v });
  hpos += back ? -1 : 1;
  setTimeout(() => { replaying = false; }, 80);
}
const put = (prop, v) => { if (!sel) return; const f = frames.get(sel.file);
  if (f) tellAgent(f, { t: "style", path: sel.path, prop, value: v }); };

function fld({ label, value, unit, prop, set, kind, opts, min, max, step, onSet }) {
  const sink = onSet || ((v) => put(prop, v));
  const f = document.createElement("div");
  f.className = "f" + (set ? " set" : "");
  const lb = document.createElement("span"); lb.className = "lb";
  lb.innerHTML = "<i></i>"; lb.append(label);
  f.append(lb);
  if (kind === "color") {
    const t = document.createElement("input"); t.value = value; t.readOnly = true;
    if (prop && !onSet) { t.dataset.hex = "1"; bound.set(prop, t); }
    const sw = document.createElement("input"); sw.type = "color"; sw.className = "sw";
    sw.value = /^#[0-9a-f]{6}$/i.test(value) ? value : "#000000";
    sw.oninput = () => { t.value = sw.value.toUpperCase(); sink(sw.value); };
    f.append(t, sw);
  } else if (kind === "select") {
    const s = document.createElement("select");
    for (const o of (opts.includes(value) ? opts : [value, ...opts])) {
      const op = document.createElement("option"); op.value = op.textContent = o; s.append(op); }
    s.value = value; s.onchange = () => sink(s.value);
    f.append(s);
  } else if (kind === "text") {
    const i = document.createElement("input");
    i.value = value; i.spellcheck = false;
    i.onchange = () => sink(i.value);
    f.append(i);
  } else {
    const i = document.createElement("input");
    const kw = opts || [];
    const lo = min === undefined ? -Infinity : min;
    const hi = max === undefined ? Infinity : max;
    const dec = step && step < 1;
    i.value = value; i.spellcheck = false;
    if (prop && !onSet) { if (unit === "px") i.dataset.px = "1"; bound.set(prop, i); }
    i.setAttribute("inputmode", dec ? "decimal" : "numeric");
    i.setAttribute("autocomplete", "off");
    let last = value;

    const commit = (raw, silent) => {
      const t = String(raw).trim();
      if (kw.includes(t)) { last = t; i.value = t; if (!silent) sink(t); return true; }
      if (t === "") { i.value = last; return false; }
      const n = parseFloat(t.replace(",", "."));
      if (!isFinite(n)) { i.value = last; i.classList.add("bad");
        setTimeout(() => i.classList.remove("bad"), 400); return false; }
      const c = Math.min(hi, Math.max(lo, n));
      const out = dec ? Math.round(c * 100) / 100 : Math.round(c * 1000) / 1000;
      last = String(out); i.value = last;
      if (!silent) sink(unit ? out + unit : String(out));

    };

    i.onkeydown = (e) => {
      if (e.key === "Enter") { i.blur(); return; }
      if (e.key === "Escape") { i.value = last; i.blur(); return; }
      if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      e.preventDefault();
      const base = parseFloat(i.value); if (!isFinite(base)) return;

      commit(base + d);

    if (unit) { const u = document.createElement("span"); u.className = "u"; u.textContent = unit; f.append(u); }
  }
  return f;
}
function seg(items, cur, cb, icons) {

/* ---- messages ------------------------------------------------------------- */
addEventListener("message", (e) => {
  const m = e.data || {};
  let file = null;
  for (const [k, f] of frames) if (f.contentWindow === e.source) file = k;
  if (m.t === "sel" && file) {
    const selKey = file + ":" + m.path.join(".");
    const same = sel && (sel.file + ":" + sel.path.join(".")) === selKey;
    sel = { file, path: m.path, styles: m.styles, inline: m.inline, text: m.text, tag: m.tag };
    boardSel = file;
    if (m.prev !== undefined)
      record({ kind: "style", file, path: m.path, prop: m.prop, prev: m.prev, next: m.next });
    if (same) { refreshProps(m.styles); return; }   // keep the live input, refresh the rest
    world.querySelectorAll(".board").forEach(n => n.classList.remove("selected"));
    let key = file; open.add(key);
    for (let i = 1; i < m.path.length; i++) open.add(file + ":" + m.path.slice(0, i).join("."));
    drawTree(); drawProps();
  } else if (m.t === "wheel") {
    wheel(m.dx, m.dy, m.ctrl, innerWidth / 2, innerHeight / 2);
  } else if (m.t === "over" && file) {
    denyEl.style.opacity = "0";
    for (const [k, fr] of frames) if (k !== file) tellAgent(fr, { t: "ghostoff" });
  } else if (m.t === "resized" && file) {
    record({ kind: "size", file, path: m.path, pw: m.pw, ph: m.ph, w: m.w, h: m.h });
  } else if (m.t === "src" || m.t === "vars") {
    const r = pend.get(m.id); if (r) { pend.delete(m.id); r(m.t === "src" ? m.html : m.vars); }
  } else if (m.t === "txt" && file) {
    record({ kind: "text", file, path: m.path, prev: m.prev, next: m.next });
  } else if (m.t === "tree" || m.t === "html") {
    const r = pend.get(m.id); if (r) { pend.delete(m.id); r(m.tree !== undefined ? m.tree : m.html); }
  }
});

/* ---- placement affordance ------------------------------------------------- */
const INSERT = ["text", "rect", "ellipse"];
const denyEl = $("#deny");
const SHAPE_W = { text: 90, rect: 160, ellipse: 120 }, SHAPE_H = { text: 24, rect: 90, ellipse: 120 };
let overBoard = 0;
function denyAt(e) {
  if (!INSERT.includes(mode)) { denyEl.style.opacity = "0"; return; }
  const t = e.target;
  if (t && t.closest && t.closest(".board-frame")) { denyEl.style.opacity = "0"; return; }
  const w = SHAPE_W[mode] * view.k, h = SHAPE_H[mode] * view.k;
  denyEl.style.width = w + "px"; denyEl.style.height = h + "px";
  denyEl.style.left = (e.clientX - w / 2) + "px"; denyEl.style.top = (e.clientY - h / 2) + "px";
  denyEl.style.borderRadius = mode === "ellipse" ? "50%" : "6px";
  denyEl.textContent = w > 120 ? "Drop inside an artboard" : "";
  denyEl.style.opacity = "1";
}
addEventListener("pointermove", denyAt);
addEventListener("pointerleave", () => { denyEl.style.opacity = "0"; });

/* ---- pan / zoom ----------------------------------------------------------- */
let drag = null, stroke = null, strokeEl = null;
const wpt = (e) => [Math.round((e.clientX - view.x) / view.k), Math.round((e.clientY - view.y) / view.k)];
viewport.addEventListener("pointerdown", (e) => {
  if (mode === "pen" || mode === "arrow") { const [x, y] = wpt(e);
    stroke = { d: `M${x} ${y}`, x0: x, y0: y, arrow: mode === "arrow", ...(pages.length ? { page } : {}) };
    mark(); drawings.push(stroke); viewport.setPointerCapture(e.pointerId);
    strokeEl = mkPath(stroke); ink.append(strokeEl);            // one node, then mutate it
    viewport.setPointerCapture(e.pointerId); return; }
  if (mode === "note" && !e.target.closest(".note")) { placeNote(e); return; }
  if (e.target.closest(".board") || e.target.closest(".note")) return;
  deselect();
  touched = true; drag = { x: e.clientX - view.x, y: e.clientY - view.y };
  viewport.classList.add("panning"); viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener("pointermove", (e) => {
  if (stroke) { const [x, y] = wpt(e);
    if (stroke.arrow) { stroke.x1 = x; stroke.y1 = y; } else stroke.d += ` L${x} ${y}`;
    if (strokeEl) strokeEl.setAttribute("d", pathD(stroke));    // no full rebuild per frame
    return; }
  if (!drag) return;
  view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; apply();
});
const endDrag = () => { if (stroke) commitCanvas("ink");
  drag = null; stroke = null; strokeEl = null; viewport.classList.remove("panning"); };
viewport.addEventListener("pointerup", endDrag);
viewport.addEventListener("pointercancel", endDrag);
function zoomAt(cx, cy, dy) {
  const k = Math.min(4, Math.max(.05, view.k * Math.exp(-dy * .01)));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k; apply();
}
function wheel(dx, dy, ctrl, cx, cy) {
  touched = true;
  if (ctrl) return zoomAt(cx, cy, dy);          // pinch, or ctrl/cmd + wheel
  view.x -= dx; view.y -= dy; apply();          // two fingers pans, like every canvas tool
}
viewport.addEventListener("wheel", (e) => {
  e.preventDefault();
  wheel(e.deltaX, e.deltaY, e.ctrlKey || e.metaKey, e.clientX, e.clientY);
}, { passive: false });

function bounds() {
  const it = [...boards.filter(onPage).map(b => ({ x: b.x||0, y: (b.y||0)-26, w: b.w||800, h: (b.h||600)+26 })),
              ...notes.filter(onPage).map(n => ({ x: n.x||0, y: n.y||0, w: n.w||240, h: 100 }))];
  if (!it.length) return null;
  return it.reduce((a, i) => ({ x1: Math.min(a.x1, i.x), y1: Math.min(a.y1, i.y),
    x2: Math.max(a.x2, i.x+i.w), y2: Math.max(a.y2, i.y+i.h) }),
    { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity });
}
function fit() {
  const b = bounds(); if (!b) return;
  const side = document.body.classList.contains("no-side") ? 0 : 330;
  const pad = 60, W = viewport.clientWidth - side - pad*2, H = viewport.clientHeight - pad*2 - 50;
  view.k = Math.min(2, Math.max(.05, Math.min(W/(b.x2-b.x1), H/(b.y2-b.y1))));
  view.x = pad + (W - (b.x2-b.x1)*view.k)/2 - b.x1*view.k;
  view.y = pad + (H - (b.y2-b.y1)*view.k)/2 - b.y1*view.k;
  apply();
}
let rt = null;
addEventListener("resize", () => { if (touched) return; clearTimeout(rt); rt = setTimeout(fit, 120); });

/* ---- ink ------------------------------------------------------------------ */
function pathD(d) {
  let dd = d.d;
    if (d.arrow && d.x1 !== undefined) {
      const a = Math.atan2(d.y1 - d.y0, d.x1 - d.x0), L = 14;
      dd = `M${d.x0} ${d.y0} L${d.x1} ${d.y1}` +
        ` M${d.x1} ${d.y1} L${d.x1 - L*Math.cos(a - .4)} ${d.y1 - L*Math.sin(a - .4)}` +
        ` M${d.x1} ${d.y1} L${d.x1 - L*Math.cos(a + .4)} ${d.y1 - L*Math.sin(a + .4)}`;
    }
  return dd;
}
function mkPath(d) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", pathD(d)); p.setAttribute("fill", "none");
  p.setAttribute("stroke", d.stroke || "#e0568c"); p.setAttribute("stroke-width", d.width || 3);
  p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
  return p;
}
function paintInk() {
  ink.textContent = "";
  for (const d of drawings) {
    if (pages.length && (d.page || pages[0].id) !== page) continue;
    ink.append(mkPath(d));
  }
}

/* ---- notes / artboards ---------------------------------------------------- */
function wireNote(el, n) {
  let d = null;
  el.addEventListener("pointerdown", (e) => {
    if (el.isContentEditable) return;
    e.stopPropagation();
    d = { x: e.clientX/view.k - (n.x||0), y: e.clientY/view.k - (n.y||0) };
    mark(); el.classList.add("dragging"); el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", (e) => { if (!d) return;
    n.x = Math.round(e.clientX/view.k - d.x); n.y = Math.round(e.clientY/view.k - d.y);
    el.style.left = n.x + "px"; el.style.top = n.y + "px"; });
  el.addEventListener("pointerup", () => { if (d) commitCanvas("move note");
    d = null; el.classList.remove("dragging"); });
  el.addEventListener("dblclick", (e) => { e.stopPropagation();
    el.contentEditable = "true"; el.focus(); });
  el.addEventListener("focus", mark);
  el.addEventListener("blur", () => { el.contentEditable = "false"; n.text = el.textContent;
    commitCanvas("edit note"); });
}
function placeNote(e) {
  const [x, y] = wpt(e);
  let i = 1; while (notes.some(n => n.id === "note-" + i)) i++;
  mark();
  notes.push({ id: "note-" + i, x, y, w: 240, text: "New note", ...(pages.length ? { page } : {}) });
  render(); commitCanvas("note");
}
function addArtboard() {
  const b = bounds();
  let i = 1; while (files["Artboard" + i + ".html"]) i++;
  const name = "Artboard" + i + ".html";
  files[name] = '<!doct' + 'ype html><meta charset="utf-8">' +
    '<style>body{margin:0;background:#fff;font-family:system-ui,sans-serif}</style>' +
    '<div style="padding:32px"></div>';
  mark();
  boards.push({ file: name, x: b ? b.x2 + 80 : 0, y: b ? b.y1 + 26 : 0, w: 800, h: 600,
    ...(pages.length ? { page } : {}) });
  render(); commitCanvas("artboard"); setMode("select"); drawTree();
}
function dl(file) {
  const blob = new Blob([files[file]], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = file; a.click(); URL.revokeObjectURL(a.href);
}

/* ---- focus / print / save ------------------------------------------------- */
const focusEl = $("#focus");
function focusOn(b) {
  focusEl.querySelectorAll("iframe").forEach(n => n.remove());
  const f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts"); f.srcdoc = resolve(files[b.file], false);
  focusEl.append(f); focusEl.classList.add("on");
}
$("#focus-close").onclick = () => focusEl.classList.remove("on");
$("#print").onclick = () => {
  const o = $("#print-out"); o.textContent = "";
  for (const b of boards) {
    if (!onPage(b) || files[b.file] === undefined) continue;
    const w = document.createElement("div"); w.className = "p";
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts");
    f.width = b.w || 800; f.height = b.h || 600; f.srcdoc = resolve(files[b.file], false);
    w.append(f); o.append(w);
  }
  setTimeout(() => print(), 500);
};
const askHtml = (f) => new Promise((res) => {
  const id = ++seq; pend.set(id, res); tellAgent(f, { t: "serialize", id });
  setTimeout(() => { if (pend.has(id)) { pend.delete(id); res(null); } }, 3000);
});
async function save() {
  const btn = $("#t-save"), was = btn.textContent;
  btn.textContent = "Saving…"; btn.disabled = true;
  try {
    for (const [file, f] of frames) { const h = await askHtml(f); if (h) files[file] = h; }
    const state = JSON.stringify({ title: DOC.title, files, canvas: manifest })
      .replace(/<\/script/gi, "<\\/script").replace(/<!\x2D\x2D/g, "<\\!--");
    const c = document.documentElement.cloneNode(true);
    c.querySelector("#world").innerHTML = '<svg id="ink"></svg>';
    c.querySelector("#print-out").textContent = "";
    c.querySelectorAll("#focus iframe").forEach(n => n.remove());
    c.querySelector("#tools").textContent = "";
    c.querySelector("#tree").textContent = "";
    c.querySelector("#props").textContent = "";
    c.querySelector("#canvas-doc").textContent = state;
    const blob = new Blob(["<!doct" + "ype html>\n" + c.outerHTML], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (DOC.title || "canvas").toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".html";
    a.click(); URL.revokeObjectURL(a.href);
    btn.textContent = "Saved";
  } catch (err) { btn.textContent = "Failed"; console.error(err); }
  setTimeout(() => { btn.textContent = was; btn.disabled = false; }, 1300);
}
$("#t-save").onclick = save;
$("#t-toggle").innerHTML = ICON.side;
$("#t-toggle").onclick = () => {
  document.body.classList.toggle("no-side");
  if (!touched) setTimeout(fit, 270);   // refit once the slide has landed
};
$("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return;
  $("#tabs").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  const t = tab = b.dataset.tab;
  treeEl.style.display = t === "edit" ? "" : "none";
  toolsEl.style.display = t === "edit" ? "" : "none";
  if (t === "edit") drawProps();
  else if (t === "code") drawCode();
  else drawTweaks();
};

function pickFile() { return boardSel || (sel && sel.file) || boards.filter(onPage)[0]?.file; }
function note(msg) { propsEl.textContent = "";
  const e = document.createElement("div"); e.className = "empty"; e.innerHTML = msg;
  propsEl.append(e); }

function drawCode() {
  const file = pickFile();
  if (!file) return note("<b>Code</b>Select an artboard first.");
  const f = frames.get(file);
  propsEl.textContent = "";
  const sec = section(file.replace(/\.html$/i, ""));
  const ta = document.createElement("textarea");
  ta.style.cssText = "min-height:52vh;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace";
  ta.spellcheck = false; ta.value = files[file];
  const bar = document.createElement("div"); bar.className = "g"; bar.style.marginTop = "8px";
  const apply = document.createElement("button");
  apply.className = "btn"; apply.textContent = "Apply";
  apply.onclick = () => { if (ta.value === files[file]) return;
    mark0(file); files[file] = ta.value; _rcache.clear(); render(); askTree(file);
    record({ kind: "src", file, prev: srcPrev, next: ta.value });
    apply.textContent = "Applied"; setTimeout(() => apply.textContent = "Apply", 1100); };
  const rev = document.createElement("button");
  rev.className = "btn ghost"; rev.textContent = "Revert";
  rev.onclick = () => { ta.value = files[file]; };
  bar.append(apply, rev);
  sec.append(ta, bar); propsEl.append(sec);
  if (f) { const id = ++seq; pend.set(id, (html) => { if (html) { ta.value = html; } });
    tellAgent(f, { t: "src", id }); }
}
let srcPrev = "";
const mark0 = (file) => { srcPrev = files[file]; };

function drawTweaks() {
  const file = pickFile();
  if (!file) return note("<b>Tweaks</b>Select an artboard first.");
  const f = frames.get(file);
  if (!f) return note("<b>Tweaks</b>Artboard is not loaded.");
  const id = ++seq;
  pend.set(id, (vars) => {
    const keys = Object.keys(vars || {}).sort();
    if (!keys.length) return note("<b>No design tokens</b>This artboard defines no CSS custom "
      + "properties on :root, html or body.");
    propsEl.textContent = "";
    const sec = section("Design tokens", () => { for (const k of keys)
      tellAgent(f, { t: "setvar", name: k, value: "" }); setTimeout(() => drawTweaks(), 120); });
    for (const k of keys) {
      const v = vars[k];
      const isColor = /^#|^rgb|^hsl|^oklch/i.test(v);
      sec.append(grp(fld({ label: k.replace(/^--/, ""), value: isColor ? v.toUpperCase() : v,
        prop: k, kind: isColor ? "color" : "text", set: true,
        onSet: (nv) => tellAgent(f, { t: "setvar", name: k, value: nv }) })));
    }
    propsEl.append(sec);
  });
  tellAgent(f, { t: "vars", id });
}
$("#zoom-in").onclick = () => { touched = true; view.k = Math.min(4, view.k*1.25); apply(); };
$("#zoom-out").onclick = () => { touched = true; view.k = Math.max(.05, view.k/1.25); apply(); };
$("#fit").onclick = () => { touched = false; fit(); };

/* ---- present mode --------------------------------------------------------- */
let slide = -1;
const deck = () => boards.filter(b => onPage(b) && files[b.file] !== undefined);
function showSlide(i) {
  const d = deck(); if (!d.length) return;
  slide = (i + d.length) % d.length;
  const b = d[slide];
  focusEl.querySelectorAll("iframe").forEach(n => n.remove());
  const f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts");
  f.srcdoc = resolve(files[b.file], false);
  const pad = 68, maxW = innerWidth - pad, maxH = innerHeight - pad - 40;
  const k = Math.min(maxW / (b.w || 800), maxH / (b.h || 600), 1.6);
  f.style.width = Math.round((b.w || 800) * k) + "px";
  f.style.height = Math.round((b.h || 600) * k) + "px";
  focusEl.append(f);
  $("#slide-n").textContent = (slide + 1) + " / " + d.length;
}
function present(on) {
  document.body.classList.toggle("present", on);
  focusEl.classList.toggle("on", on);
  if (on) { showSlide(slide < 0 ? 0 : slide); }
  else { slide = -1; focusEl.querySelectorAll("iframe").forEach(n => n.remove()); }
}
$("#s-next").onclick = () => showSlide(slide + 1);
$("#s-prev").onclick = () => showSlide(slide - 1);
$("#s-exit").onclick = () => present(false);
addEventListener("resize", () => { if (document.body.classList.contains("present")) showSlide(slide); });
addEventListener("keydown", (e) => {
  if (!document.body.classList.contains("present")) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
    e.preventDefault(); showSlide(slide + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); showSlide(slide - 1); }
  else if (e.key === "Escape") present(false);
}, true);

/* ---- pages / boot --------------------------------------------------------- */
const pagesSel = $("#pages");
if (pages.length) {
  for (const p of pages) { const o = document.createElement("option");
    o.value = p.id; o.textContent = p.name; pagesSel.append(o); }
  pagesSel.hidden = false; $("#pages-sep").hidden = false;
  pagesSel.onchange = () => { page = pagesSel.value; touched = false;
    render(); paintInk(); drawTree(); fit(); };
}
const readOnly = DOC.mode === "view";
if (readOnly) { document.body.classList.add("view"); $("#t-save").remove(); }
$("#t-present").onclick = () => present(true);
const launch = manifest.launch || { view: "canvas" };
page = pages.length ? (launch.page || pages[0].id) : null;
if (pages.length) pagesSel.value = page;
setMode("select");
render(); paintInk(); drawTree(); drawProps();
if (launch.view === "focused" && files[launch.file])
  focusOn(boards.find(b => b.file === launch.file) || { file: launch.file });
fit();
})();
</script>
</body>
